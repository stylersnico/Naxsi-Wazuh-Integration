<!--
  Naxsi log collection block for the Wazuh agent.

  Paste these <localfile> entries inside the <ossec_config> section of
  /var/ossec/etc/ossec.conf on the reverse-proxy host, then restart the
  agent. One entry per vhost - update this list if vhosts are added or
  removed on the reverse-proxy (see the "Infrastructure config" repo,
  Reverse-NGINX/sites-enabled/).
-->
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/nginx/abyssproject.net/naxsi_error.log</location>
</localfile>
